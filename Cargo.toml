[package]
name = "pyskani"
version = "0.2.0"
authors = ["Martin Larralde <martin.larralde@embl.de>"]
license = "MIT"
description = "PyO3 bindings and Python interface to skani, a method for fast fast genomic identity calculation using sparse chaining."
repository = "https://github.com/althonos/pyskani"
homepage = "https://github.com/althonos/pyskani/"
readme = "README.md"
categories = ["science"]
keywords = ["bioinformatics", "genomics", "average", "nucleotide", "identity"]
edition = "2021"
build = "src/pyskani/_skani/build.rs"
exclude = ["wheelhouse", "dist", "src/pyskani/tests/*.fasta.gz", "src/pyskani/tests/db_*"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/pyskani/_skani/lib.rs"
doctest = false

[build-dependencies.built]
version = "0.8.0"
features = ["chrono", "cargo-lock"]

[dependencies]
bincode = "1.3.3"
pyo3 = "0.25.0"
pyo3-built = "0.6.0"
serde = "1"

[dependencies.skani]
version = "0.4.0"
default-features = false
features = ["cli"]

[dependencies.smallvec]
version = "1"
features = ["union", "serde", "write"]

[features]
default = []
extension-module = ["pyo3/extension-module", "pyo3/abi3-py38"]
nightly = ["pyo3/nightly"]

[[test]]
name = "unittest"
path = "src/pyskani/tests/unittest.rs"
harness = false
